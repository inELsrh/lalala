let examCount = 0;
let historyRecords = [];

// 初始化題目
function renderQuiz() {
    const container = document.getElementById("questionsContainer");
    let html = "";
    quizData.forEach((item, index) => {
        html += `<div class="question-card">
            <div class="question-title">Q${index + 1}. ${item.q}</div>
            <div class="options">`;
        
        if (item.type === "radio") {
            for (let key in item.options) {
                html += `<label><input type="radio" name="q${index}" value="${key}"> ${key}. ${item.options[key]}</label>`;
            }
        } else if (item.type === "checkbox") {
            for (let key in item.options) {
                html += `<label><input type="checkbox" name="q${index}" value="${key}"> ${key}. ${item.options[key]}</label>`;
            }
        } else if (item.type === "text") {
            html += `<input type="text" name="q${index}" placeholder="請輸入答案...">`;
        }
        
        html += `</div></div>`;
    });
    container.innerHTML = html;
}

// 提交並計分
function submitQuiz() {
    examCount++;
    let score = 0;
    let total = quizData.length;
    let detailsHtml = "";

    quizData.forEach((item, index) => {
        let userAns = [];
        if (item.type === "radio") {
            let selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected) userAns.push(selected.value);
        } else if (item.type === "checkbox") {
            let selected = document.querySelectorAll(`input[name="q${index}"]:checked`);
            selected.forEach(el => userAns.push(el.value));
            userAns.sort();
        } else if (item.type === "text") {
            let val = document.querySelector(`input[name="q${index}"]`).value.trim();
            userAns = val;
        }

        let correctAns = item.answer;
        let isCorrect = false;

        if (item.type === "checkbox") {
            // 複選只要錯1個就是全錯 (比對陣列是否完全相符)
            if (JSON.stringify(userAns) === JSON.stringify([...correctAns].sort())) {
                isCorrect = true;
            }
        } else if (item.type === "text") {
            if (userAns === correctAns) {
                isCorrect = true;
            }
        } else {
            if (userAns.length === 1 && userAns[0] === correctAns[0]) {
                isCorrect = true;
            }
        }

        if (isCorrect) score++;

        // 整理詳情
        let userAnsStr = Array.isArray(userAns) ? userAns.join(" ") : (userAns || "(未作答)");
        let correctAnsStr = Array.isArray(correctAns) ? correctAns.join(" ") : correctAns;
        
        detailsHtml += `<div>Q${index + 1}: ${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'} 
            | 你的答案: ${userAnsStr} | 正確答案: <span class="correct">${correctAnsStr}</span></div>`;
    });

    let resultMsg = `第 ${examCount} 次考試結果：得分 ${score} / ${total} 分 (正確率: ${((score/total)*100).toFixed(1)}%)`;
    
    // 顯示當次結果
    let currentResultBox = document.getElementById("currentResult");
    currentResultBox.style.display = "block";
    currentResultBox.innerHTML = `<h3>${resultMsg}</h3><div class="ans-explain">${detailsHtml}</div>`;

    // 儲存至歷史紀錄
    historyRecords.unshift({
        title: `第 ${examCount} 次考試`,
        score: `${score} / ${total}`,
        details: detailsHtml
    });

    renderHistory();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderHistory() {
    const historyContainer = document.getElementById("historyContainer");
    let html = "";
    historyRecords.forEach(rec => {
        html += `<div class="history-item">
            <strong>${rec.title}</strong> - 得分: ${rec.score}
            <div class="ans-explain" style="max-height: 150px; overflow-y: auto; margin-top: 5px;">${rec.details}</div>
        </div>`;
    });
    historyContainer.innerHTML = html;
}

// 頁面載入時初始化
window.onload = renderQuiz;
